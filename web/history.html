<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ozara — History</title>
<link rel="icon" href="favicon.ico" sizes="48x48">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<header class="topbar">
  <a class="brand" href="home.html" aria-label="Ozara home">
    <img class="brand-logo" src="images/ozara-logo-white.png" alt="Ozara — sensor-assisted ozone treatment">
  </a>
  <div class="topbar-right">
    <span class="status-dot" id="connDot" title="Database connection"></span>
    <span class="user-email" id="userEmail"></span>
    <button class="logout-btn" id="logoutBtn">Sign out</button>
  </div>
</header>

<div class="app-layout">

  <nav class="sidebar" aria-label="Main navigation">
    <a class="nav-btn" href="home.html">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      <span>Home</span>
    </a>
    <a class="nav-btn" href="monitor.html">
      <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>

    </a>
    <a class="nav-btn" href="profile.html">

      <span>Profile</span>
    </a>

  <main class="app-main" id="historyMain">
    <p class="log-empty" id="historyEmpty">Loading history…</p>
  </main>

</div>

<p class="version">Ozara v1.0 · ESP32 IoT</p>

<script type="module" src="js/history.js"></script>
