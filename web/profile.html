<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ozara — Profile</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
        <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
        <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
      </svg>
    </div>
    <div>
      <p class="brand-name">Ozara</p>
      <p class="brand-sub">Automated fabric sanitization</p>
    </div>
  </div>
  <div class="topbar-right">
    <span class="status-dot" id="connDot" title="Database connection"></span>
    <span class="user-email" id="userEmail"></span>
    <button class="logout-btn" id="logoutBtn">Sign out</button>
  </div>
</header>

<div class="app-layout">

  <nav class="sidebar" aria-label="Main navigation">
    <a class="nav-btn" href="home.html">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      <span>Home</span>
    </a>
    <a class="nav-btn" href="live.html">
      <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      <span>Live</span>
    </a>
    <a class="nav-btn" href="monitor.html">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>
      <span>Monitor</span>
    </a>
    <a class="nav-btn" href="history.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>History</span>
    </a>
    <a class="nav-btn active" href="profile.html" aria-current="page">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <main class="app-main">
    <section class="card placeholder-card">
      <p class="card-title">Profile</p>
      <p class="log-empty" id="profilePlaceholder">Account settings will show up here once it's built.</p>
    </section>

  </main>

</div>

<script type="module" src="js/profile.js"></script>

</body>
</html>
